<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RONMAR WATCH</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }
    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #f5d390;
    }
    .title {
      font-size: 22px;
      margin-bottom: 40px;
      opacity: 0.9;
    }
    .desc {
      font-size: 16px;
      line-height: 1.8;
      max-width: 600px;
      margin: 0 auto 50px;
      opacity: 0.8;
    }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: #f5d390;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background: #ffc107;
      transform: scale(1.05);
    }
    .footer {
      margin-top: 80px;
      font-size: 14px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">RONMAR WATCH</div>
    <div class="title">高端腕表 · 优雅永恒</div>
    <div class="desc">
      专注品质腕表，传承时间艺术，每一款腕表都代表经典、品味与匠心。
      这里是您的专属腕表空间。
    </div>
    <a href="#" class="btn">进入官网</a>
    <div class="footer">
      © 2025 RONMAR WATCH · All Rights Reserved
    </div>
  </div>
</body>
</html>
